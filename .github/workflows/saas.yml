name: SaaS

on:
  push:
    paths: ["saas/**"]
  pull_request:
    paths: ["saas/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: saas/requirements-dev.txt
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check packages/cc_engine/cc_engine apps tests
      - name: Pytest
        run: pytest -q

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pdf.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check deribit_engine tests scripts

      - name: Ruff format
        run: ruff format --check deribit_engine tests scripts

      - name: pip-audit (runtime + pdf requirement sets)
        run: pip-audit -r requirements.txt -r requirements-pdf.txt

      - name: Pytest
        run: pytest tests/ -q --cov=deribit_engine --cov-report=term-missing:skip-covered --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # scripts/run_e2e_dashboard.py (Playwright webServer) needs the core runtime
      # (FastAPI/uvicorn) plus pytest, because it imports make_config from
      # tests/conftest.py which imports pytest at module level. No ruff/pdf extras.
      - name: Install Python dependencies
        run: pip install -r requirements.txt "pytest>=8,<10"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build dashboard bundle
        working-directory: frontend
        run: npm run build

      - name: JS unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

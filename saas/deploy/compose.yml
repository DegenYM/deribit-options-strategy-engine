services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccsaas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccsaas}
      POSTGRES_DB: ccsaas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccsaas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ccsaas:${POSTGRES_PASSWORD:-ccsaas}@postgres:5432/ccsaas
      CC_SAAS_DATA_DIR: /var/lib/cc-saas
    volumes:
      - saasdata:/var/lib/cc-saas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  supervisor:
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    command: ["python", "-m", "cc_supervisor.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ccsaas:${POSTGRES_PASSWORD:-ccsaas}@postgres:5432/ccsaas
      CC_SAAS_DATA_DIR: /var/lib/cc-saas
    volumes:
      - saasdata:/var/lib/cc-saas
    depends_on:
      - api

  marketd:
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    command: ["python", "-m", "cc_marketd.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ccsaas:${POSTGRES_PASSWORD:-ccsaas}@postgres:5432/ccsaas
      CC_SAAS_DATA_DIR: /var/lib/cc-saas
    volumes:
      - saasdata:/var/lib/cc-saas
    depends_on:
      - api

volumes:
  pgdata:
  saasdata:

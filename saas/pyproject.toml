[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "covered-call-saas"
version = "0.1.0"
description = "BYOK hosted Covered Call automation for Deribit (not investment advice)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "cryptography>=43,<47",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "stripe>=11,<15",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<7",
    "pytest-socket>=0.7,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["packages/cc_engine", "apps/api", "apps/supervisor", "apps/marketd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/cc_engine", "apps/api", "apps/supervisor", "apps/marketd"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]
ignore = ["B008"]

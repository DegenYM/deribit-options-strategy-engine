repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # pytest: uses pyproject.toml addopts (--disable-socket --allow-unix-socket) so
  # pre-commit matches CI socket blocking. Coverage (--cov --cov-fail-under=60)
  # is enforced in GitHub Actions only; omit here to keep commits fast.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest tests/ -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
